---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: randomnumber
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: randomnumber-app
  template:
    metadata:
      labels:
        app: randomnumber-app
    spec:
      securityContext:
            fsGroup: 1000
            runAsUser: 1000
      serviceAccountName: default
      containers:
        - name: randomnumber-app
          image: docker.io/hades2004/randomnumber:latest
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "random_db"
            - name: DB_USER
              value: "user"
            - name: DB_PASSWORD
              value: "password"
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "500Mi"
              cpu: "500m"
          ports:
            - name: httpport
              containerPort: 8081
            - name: jnlpport
              containerPort: 50000
          livenessProbe:
            httpGet:
              path: "/randomNumber"
              port: 8081
              httpHeaders:
              - name: Authorization
                value: Basic bW9uaXRvcmluZzpwYXNzd29yZA==
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: "/randomNumber"
              port: 8081
              httpHeaders:
              - name: Authorization
                value: Basic bW9uaXRvcmluZzpwYXNzd29yZA==              
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
